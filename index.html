<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body style="--image-url: url(galaxy.webp)" class="center-image">
    
    <div class="solar-system">
        <div class="sun center-position center-image" style="--image-url: url(sun.png)"></div>
        
        <div class="orbit center-position" style="--orbit: 150px; --orbit-period: 8.8s">
            <div class="planet center-position center-image" style="--planet: 15px; --image-url: url(mercury.png); --rotation-period: 5.86s"></div>
        </div>
        
        <div class="orbit center-posision" style="--orbit:200px; --orbit-period: 22.5s">
            <div class="planet center-position center-image" style="--planet: 20px; --image-url: url(venus.png); --rotation-period: 24.3s"></div>
        </div>
        <div class="orbit center-posision" style="--orbit:300px; --orbit-period: 36.5s"></div>
        <div class="orbit center-posision" style="--orbit:400px; --orbit-period: 68.7s"></div>
        <div class="orbit center-posision" style="--orbit:550px; --orbit-period: 118.6s"></div>
        <div class="orbit center-posision" style="--orbit:650px; --orbit-period: 294.6s"></div>
        <div class="orbit center-posision" style="--orbit:750px; --orbit-period: 840s"></div>
        <div class="orbit center-posision" style="--orbit:850px; --orbit-period: 1648s"></div>
    </div>
    
</body>
</html>
